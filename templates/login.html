{% extends "base.html" %}
{% block title %}Bookworm - Sign In{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <svg class="brand-icon-lg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="22" height="32" rx="2" fill="#A0896C" stroke="#6B5B45" stroke-width="1.5"/>
            <rect x="6" y="4" width="18" height="32" rx="1" fill="#EDE6D6"/>
            <path d="M10 12h10M10 16h10M10 20h7" stroke="#8B7355" stroke-width="1.2" stroke-linecap="round"/>
            <ellipse cx="30" cy="28" rx="6" ry="7" fill="#9CAF88"/>
            <ellipse cx="30" cy="21" rx="4.5" ry="5" fill="#7A8B6F"/>
            <circle cx="29" cy="19.5" r="1" fill="#3D3425"/>
            <ellipse cx="30" cy="15" rx="3" ry="3.5" fill="#9CAF88"/>
            <path d="M28 12 Q30 8 32 12" stroke="#7A8B6F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <h2>Sign in to Bookworm</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div id="login-error" style="color: #C0392B; font-size: 0.85rem; margin-bottom: 12px; display: none;"></div>
            <button type="submit" class="btn btn-primary" id="login-submit">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-submit');
    const errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';

    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            }),
        });
        const data = await resp.json();
        if (!resp.ok) {
            throw new Error(data.error || 'Login failed');
        }
        window.location.href = '/';
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
});
</script>
{% endblock %}
