<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookworm{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>

<!-- ===== Top Bar ===== -->
<header class="topbar">
    <div class="topbar-left">
        <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <a href="/" class="brand">
            <!-- Bookworm Logo SVG -->
            <svg class="brand-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="4" width="22" height="32" rx="2" fill="#A0896C" stroke="#6B5B45" stroke-width="1.5"/>
                <rect x="6" y="4" width="18" height="32" rx="1" fill="#EDE6D6"/>
                <path d="M10 12h10M10 16h10M10 20h7" stroke="#8B7355" stroke-width="1.2" stroke-linecap="round"/>
                <ellipse cx="30" cy="28" rx="6" ry="7" fill="#9CAF88"/>
                <ellipse cx="30" cy="21" rx="4.5" ry="5" fill="#7A8B6F"/>
                <circle cx="29" cy="19.5" r="1" fill="#3D3425"/>
                <ellipse cx="30" cy="15" rx="3" ry="3.5" fill="#9CAF88"/>
                <path d="M28 12 Q30 8 32 12" stroke="#7A8B6F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
            <span class="brand-name">Bookworm</span>
        </a>
    </div>
    <div class="topbar-right" id="user-area">
        <a href="/login" class="login-btn">Sign In</a>
    </div>
</header>

<!-- ===== Sidebar ===== -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
        <div class="sidebar-section-title">Navigation</div>
    </div>
    <a href="/" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
    </a>

    <div class="sidebar-section" style="margin-top: 8px;">
        <div class="sidebar-section-title">Book Management</div>
    </div>
    <a href="/add-book" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>Add New Book</span>
    </a>
    <a href="/remove-book" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V3h6v3"/>
        </svg>
        <span>Remove Book</span>
    </a>
    <a href="/sell-book" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Sell Book</span>
    </a>

    <div class="sidebar-section" style="margin-top: 8px;">
        <div class="sidebar-section-title">Operations</div>
    </div>
    <a href="/inventory" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span>Manage Inventory</span>
    </a>
    <a href="/pricing" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span>Price Manager</span>
    </a>
</nav>

<!-- ===== Main Content ===== -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<!-- ===== Scripts ===== -->
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
